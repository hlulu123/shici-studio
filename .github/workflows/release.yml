name: release

# 在 GitHub 上发布 Release 后，自动打包 shici-studio.skill 并上传为附件
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build shici-studio.skill
        run: zip -r shici-studio.skill shici-studio -x '*.DS_Store' '*/__pycache__/*'
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" shici-studio.skill --clobber --repo "${{ github.repository }}"
